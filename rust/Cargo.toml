[package]
name = "evitation-sky"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "空の色シミュレータの数値核。TypeScript 実装 (src/physics/) の移植"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.wasm-pack.profile.release]
# wasm-pack が同梱する wasm-opt は、いまの rustc が既定で吐く wasm の機能より
# 古い。明示的に有効化しないと「Bulk memory operations require bulk memory」で
# 検証に失敗する。どれも 2023 年以降のブラウザには入っている機能で、
# 対象(モバイルを含む現行ブラウザ)では問題にならない。
wasm-opt = [
  "-O3",
  "--enable-bulk-memory",
  "--enable-sign-ext",
  "--enable-nontrapping-float-to-int",
  "--enable-mutable-globals",
  "--enable-reference-types",
  "--enable-multivalue",
]
